[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-loco-manipulation"
version = "0.1.0"
description = "Unitree G1 locomotion and loco-manipulation research code for Isaac Lab."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "psutil",
]

[project.optional-dependencies]
gui = [
  "dearpygui==2.1.0",
]

[tool.setuptools.packages.find]
where = ["source"]

[tool.isort]
profile = "black"
line_length = 120
known_firstparty = "g1_loco_manipulation"
known_isaaclabparty = [
  "isaaclab",
  "isaaclab_tasks",
  "isaaclab_assets",
  "isaaclab_rl",
]

[tool.pyright]
exclude = [
  "**/__pycache__",
  "**/logs",
  ".git",
]
typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
reportMissingImports = "none"
reportMissingModuleSource = "none"
